$schema: https://json-schema.org/draft/2020-12/schema
title: AgentConfig
type: object
required: [name, retriever, critic]
additionalProperties: true
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
  retriever:
    type: object
    required: [k]
    properties:
      k:
        type: integer
        minimum: 1
        maximum: 50
  critic:
    type: object
    required: [enabled, mode]
    properties:
      enabled:
        type: boolean
      mode:
        type: string
        enum: [always, if_unsure]
